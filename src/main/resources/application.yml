spring:
  application:
    name: codelong
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    mongodb:
      uri: ${CODELONG_MONGO_URI:mongodb://localhost:27017/codelong}
      auto-index-creation: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: CodeLong
    description: Backend do jogo de conhecimento sobre Programacao e Engenharia de Software
    version: "@project.version@"

codelong:
  jwt:
    secret: ${CODELONG_JWT_SECRET:}
    expiration: ${CODELONG_JWT_EXPIRATION:8h}
  cors:
    allowed-origins: ${CODELONG_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  admin:
    username: ${CODELONG_ADMIN_USERNAME:}
    password: ${CODELONG_ADMIN_PASSWORD:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %msg%n"