services:
  mongodb:
    image: mongo:7.0
    container_name: codelong-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
    container_name: codelong-app
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CODELONG_MONGO_URI: mongodb://mongodb:27017/codelong
      CODELONG_JWT_SECRET: ${CODELONG_JWT_SECRET:?defina CODELONG_JWT_SECRET (>= 256 bits)}
      CODELONG_JWT_EXPIRATION: ${CODELONG_JWT_EXPIRATION:-2h}
      CODELONG_CORS_ALLOWED_ORIGINS: ${CODELONG_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CODELONG_ADMIN_USERNAME: ${CODELONG_ADMIN_USERNAME:-admin}
      CODELONG_ADMIN_PASSWORD: ${CODELONG_ADMIN_PASSWORD:?defina CODELONG_ADMIN_PASSWORD}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  mongo-data: